name: Desktop release
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/smoke.yml
      - package.json
      - package-lock.json
      - build/**
      - scripts/smoke-release.mjs
      - scripts/smoke-release-assets.mjs
      - scripts/publish-release.cjs
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - package.json
      - package-lock.json
      - build/**
      - scripts/smoke-release.mjs
      - scripts/smoke-release-assets.mjs
      - scripts/publish-release.cjs
  workflow_dispatch:
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/smoke.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
            args: --linux --x64
          - runner: windows-2022
            name: windows-x64
            args: --win --x64
          - runner: macos-15
            name: macos-arm64
            args: --mac --arm64
          - runner: macos-15-intel
            name: macos-x64
            args: --mac --x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke
      # The AppImage inside this job is extracted, so no FUSE is needed; xvfb still backs the launch.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps chromium
      - run: npm run desktop:release -- ${{ matrix.args }}
      # Install or unpack the ACTUAL release files (never the unpacked build) and launch each one.
      - name: Verify release files on this runner
        run: node scripts/smoke-release-assets.mjs
        env:
          AETHER_RELEASE_TARGET: ${{ matrix.name }}
      # Only the bytes that just passed may be uploaded, together with this runner's summary.
      - uses: actions/upload-artifact@v4
        with:
          name: release-verified-${{ matrix.name }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: release-verified/
      # The summary artifact contains ONLY acceptance-<target>.json, so the publish job never has to
      # guess a shared root; the launch logs go to their own artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: release-verification/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-launch-logs-${{ matrix.name }}
          retention-days: 7
          path: smoke-results/release-assets/
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-verified-*
          path: release-accepted/release-verified
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-acceptance-*
          path: release-accepted/release-acceptance
          merge-multiple: true
      - uses: actions/github-script@v7
        with:
          script: await require('./scripts/publish-release.cjs')({ github, context })
