; Aether beta.10 — ESP32-C3 firmware validation example.
;
; One application image, real serial round-trip:
;   boot   -> deterministic identity line (same firmware.bin => same identity)
;   host   -> CHALLENGE token=<fresh 16 hex> (random per run)
;   device -> RESPONSE computed from that token and the firmware identity
;
; The challenge path is memory-only: no NVS, no GPIO, no flash writes, no network.
;
; Transport: UART0 is the console and the transport QEMU exposes. The same image
; also starts a best-effort, non-blocking USB-Serial/JTAG channel; if the peripheral
; or its driver is unavailable (QEMU), UART0 keeps working and the app keeps running.
;
; Partition warning: the stock single-app layout built here is for QEMU and
; for an already verified test board ONLY. A vendor-partitioned 16 MB device must
; receive the app-only firmware.bin at a slot verified by the device owner; the
; bootloader/partition table from this example must never be written to it.
;
; Platform note: QEMU 9.2.2 (esp32c3) boots ESP-IDF 5.x images; the Espressif32
; 6.12.0 Arduino core (IDF 4.4.7) asserts in flash init under the same emulator,
; so this example builds ESP-IDF through the pioarduino 54.03.20 platform.
[platformio]
default_envs = esp32c3-qemu-uart0

[env:esp32c3-qemu-uart0]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
; App-only deploy target: the verified ota_1 slot on the vendor 16 MB device.
; The QEMU image is merged separately and is never written to the device.
board_upload.offset_address = 0x700000
; Same table as the device (verified by a read-only dump), so the built partitions.bin
; covers ota_1@0x700000 for the deploy preflight. It is still never written to the device.
board_build.partitions = partitions.vendor.csv
; Board manifest defaults to 4 MB; this target is the 16 MB vendor device.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
