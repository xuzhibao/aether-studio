name: MVP smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mvp-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run smoke:network
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: smoke-results/
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/electron
          key: hardware-tools-${{ runner.os }}-pio6.1.19-esp6.12.0-${{ hashFiles('package-lock.json') }}
          restore-keys: hardware-tools-${{ runner.os }}-pio6.1.19-esp6.12.0-
      - run: sudo apt-get update && sudo apt-get install -y clangd
      - run: python -m pip install platformio==6.1.19
      - run: npm ci
      - run: npx playwright install-deps chromium
      - run: npm run smoke:host
      - run: npm run smoke:language
      - run: platformio run -d examples/platformio-esp32s3
      - run: npm run desktop:package
      - run: xvfb-run -a npm run smoke:desktop
        env:
          AETHER_PACKAGED_EXECUTABLE: release/linux-unpacked/aether-studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: |
            smoke-results/
            examples/platformio-esp32s3/.pio/build/esp32-s3/firmware.*
            examples/platformio-esp32s3/.pio/build/esp32-s3/bootloader.bin
            examples/platformio-esp32s3/.pio/build/esp32-s3/partitions.bin
