; Aether beta.4 — ESP32-C3 with the native USB-Serial/JTAG port.
; Serial is routed to USB CDC; without both flags the USB port prints nothing
; and only UART0 (GPIO 20/21) carries the log.
[env:esp32-c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
