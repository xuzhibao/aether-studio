name: MVP smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: mvp-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run smoke:recovery
      - run: npm run smoke:network
      # MicroPython run: exact argv, shared port lease, cancellation and abnormal exit with a fake CLI.
      - run: npm run smoke:micropython
      - run: npm run smoke:micropython:files
      # Bounded native serial session log and its narrow host export (no serial port).
      - run: npm run smoke:serial-log
      # Build input cache invalidation, pre-build diff review and the AI connection test.
      - run: npm run smoke:build-inputs
      - run: npm run smoke:build-review
      - run: npm run smoke:provider
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: smoke-results/
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/electron
          key: hardware-tools-${{ runner.os }}-pio6.1.19-esp6.12.0-${{ hashFiles('package-lock.json') }}
          restore-keys: hardware-tools-${{ runner.os }}-pio6.1.19-esp6.12.0-
      # ESP32-S3 is Xtensa; LLVM 20 added the Xtensa target, so the distro clangd (18) is not enough.
      - run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc > /dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
          sudo apt-get update
          sudo apt-get install -y clangd-20
      - run: /usr/bin/clangd-20 --version
      - run: python -m pip install platformio==6.1.19
      - run: python -m pip install mpremote==1.29.0
      - run: npm ci
      - run: npx playwright install-deps chromium
      - run: npm run smoke:terminal
      - run: npm run smoke:host
      - run: npm run smoke:platformio
      - run: AETHER_CLANGD_CLI=/usr/bin/clangd-20 npm run smoke:language
      - run: AETHER_CLANGD_CLI=/usr/bin/clangd-20 npm run smoke:esp32
      - run: platformio run -d examples/platformio-esp32s3
      # ESP device contract + deploy preflight: pure parsers, the blocking rules (C3/S3 mismatch,
      # 0x10000 model overlap, 0xe000 crossing, partition rewrite) and a real preflight against real
      # PlatformIO metadata with a recording esptool; zero write commands are allowed.
      - run: npm run smoke:esp
      # Flash backup/restore runs against a file-backed fake device; no hardware is touched.
      - run: npm run smoke:flash
      # Real mpremote --version plus the fake-CLI run regression (no serial port is opened).
      - run: npm run smoke:micropython
      - run: npm run smoke:micropython:files
      # The ESP32-C3 template must compile with the native USB CDC flags.
      - run: platformio run -d examples/platformio-esp32c3
      - run: npm run desktop:package
      - run: xvfb-run -a npm run smoke:crash
      - run: xvfb-run -a npm run smoke:desktop
        env:
          AETHER_PACKAGED_EXECUTABLE: release/linux-unpacked/aether-studio
          # Only clangd-20 is installed; the Electron smoke resolves clangd from this variable.
          AETHER_CLANGD_CLI: /usr/bin/clangd-20
      - run: xvfb-run -a npm run smoke:micropython:desktop
        env:
          AETHER_PACKAGED_EXECUTABLE: release/linux-unpacked/aether-studio
      - run: xvfb-run -a npm run smoke:micropython:files:desktop
        env:
          AETHER_PACKAGED_EXECUTABLE: release/linux-unpacked/aether-studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: |
            smoke-results/
            examples/platformio-esp32s3/.pio/build/esp32-s3/firmware.*
            examples/platformio-esp32s3/.pio/build/esp32-s3/bootloader.bin
            examples/platformio-esp32s3/.pio/build/esp32-s3/partitions.bin
            examples/platformio-esp32c3/.pio/build/esp32-c3/firmware.*
            examples/platformio-esp32c3/.pio/build/esp32-c3/bootloader.bin
            examples/platformio-esp32c3/.pio/build/esp32-c3/partitions.bin
