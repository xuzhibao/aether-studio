name: MVP smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: smoke-results/
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool x11-utils imagemagick
      - run: npm ci
      - run: npm run build
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: Launch Tauri window
        run: |
          mkdir -p smoke-results
          npm run dev > smoke-results/vite.log 2>&1 &
          export DISPLAY=:99
          Xvfb :99 -screen 0 1728x1080x24 > smoke-results/xvfb.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:1420/ > /dev/null && xdpyinfo > /dev/null 2>&1; then break; fi
            sleep 1
          done
          WEBKIT_DISABLE_DMABUF_RENDERER=1 src-tauri/target/debug/aether-studio > smoke-results/tauri.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$app_pid"
            if xdotool search --onlyvisible --name 'Aether Studio' > /dev/null; then
              sleep 8
              kill -0 "$app_pid"
              import -window root smoke-results/tauri-window.png
              AETHER_APP_PID="$app_pid" bash scripts/smoke-desktop-files.sh
              echo 'PASS Tauri: native window opened and remained alive'
              exit 0
            fi
            sleep 1
          done
          cat smoke-results/tauri.log
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: smoke-results/
